<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGIC SNOW · Manual REVO</title>
  <meta name="description" content="Centro de formación REVO · Magic Snow · La Casa de las Carcasas" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand-mini">❄</div>
        <div class="brand-block">
          <p class="brand-overline">LA CASA DE LAS CARCASAS</p>
          <h1>MAGIC SNOW</h1>
          <p class="brand-subtitle">CENTRO DE FORMACIÓN REVO</p>
        </div>
      </div>

      <div class="sidebar-progress-card">
        <div class="progress-label-row">
          <span>Progreso de formación</span>
          <strong id="progressPercent">0%</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="progress-status">
          <span id="completedCount">0</span> / 6 módulos completados
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- generado por JS -->
      </nav>

      <button class="sidebar-home-btn" id="sidebarHomeBtn" type="button">
        Volver al inicio
      </button>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú">
            ☰
          </button>
          <div>
            <p class="topbar-kicker">MAGIC SNOW</p>
            <h2 class="topbar-title">MANUAL DE USO DEL DATÁFONO · REVO</h2>
          </div>
        </div>

        <div class="topbar-right">
          <div class="status-pill">
            <span class="status-dot"></span>
            Formación interactiva
          </div>
        </div>
      </header>

      <main class="content-area" id="contentArea">
        <!-- generado por JS -->
      </main>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
